[package]
name = "const_shader_layout"
version = "0.5.1"
edition = "2024"
description = "Compile-time checks to ensure structs conform to WGSL's memory layout rules"
repository = "https://github.com/beicause/const_shader_layout"
license = "MIT OR Apache-2.0"
keywords = ["const", "macro", "shader", "wgsl"]
exclude = [".github"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true
features = [
  "glam_034",
  "half",
  "std",
  "derive",
]
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["derive", "tests"]

[dependencies]
const_shader_layout_derive = { path = "./derive", version = "0.2.1", optional = true }
glam_033 = { package = "glam", version = "0.33", default-features = false, features = ["i16", "i32", "u16", "u32"], optional = true }
glam_034 = { package = "glam", version = "0.34", default-features = false, features = ["i16", "i32", "u16", "u32"], optional = true }
half = { version = "2", default-features = false, optional = true }

[features]
default = ["derive"]

# Enables derive macros `ShaderLayout` and `ShaderLayoutCompat`.
derive = ["dep:const_shader_layout_derive"]

# Implements `ShaderLayout` for `glam`(v0.33) types.
glam_033 = ["dep:glam_033"]

# Implements `ShaderLayout` for `glam`(v0.34) types. Overrides other `glam_*` features.
glam_034 = ["dep:glam_034"]

# Implements `ShaderLayout` for `half::f16`.
half = ["dep:half"]

# Reexports `glam`'s `libm` feature.
libm = ["glam_033?/libm", "glam_034?/libm"]

# Reexports `glam`'s `nostd-libm` feature.
nostd-libm = ["glam_033?/nostd-libm", "glam_034?/nostd-libm"]

# Reexports `glam`'s `std` feature.
std = ["glam_033?/std", "glam_034?/std"]

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
