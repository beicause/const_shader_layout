name: Publish

# Publishing lives in its own workflow rather than in `ci.yml` because the two
# want opposite things: `ci.yml` runs on every pull request and must never be
# able to write to the registry, while a release is started by hand and does
# nothing else.
#
# What the job publishes with is not a stored secret. It proves its identity to
# crates.io with the OIDC token GitHub mints for it, and
# `rust-lang/crates-io-auth-action` exchanges that for an access token which
# lives half an hour and is bound to this repository, this workflow file and the
# environment named below. There is nothing to rotate and nothing that can be
# stolen.
#
# Every crate published here needs its own Trusted Publishing configuration on
# crates.io, and all of them have to name the same repository, this workflow
# file (`publish.yml`) and the `release` environment. Leaving the environment
# field empty there is allowed: a configuration without one accepts any.
#
# A dispatch runs against whichever branch or tag it is started from: the
# packages carry that commit's sources, and crates.io cannot know or check which
# it is. Start it from the commit `ci.yml` has already passed.

on:
  workflow_dispatch:

# One release at a time, and never cancelled. A publish that is interrupted
# leaves the registry holding part of a release, and a version that is already
# up cannot be replaced — only a new version can be published over it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  CACHE_SUFFIX: e # cache busting

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # The environment is what a protection rule hangs off — required reviewers,
    # a deployment branch — so that a dispatch is not by itself enough to
    # publish.
    environment: release
    # runtime is normally under a minute
    timeout-minutes: 15
    permissions:
      # The OIDC token crates.io verifies the workflow's identity with.
      # Everything else the job does is a read.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # One token, one exchange. The two crates together build in well under
      # the half hour the token lives, and the action's post step revokes it when
      # the job ends rather than leaving it to expire.
      #
      # The token is handed to cargo as `CARGO_REGISTRY_TOKEN`, the variable it
      # reads by name, rather than as `--token`, which would put it in the
      # command line the log records.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.6

      # The derive crate is the only one of the two with no dependencies of its
      # own, so it goes first: `const_shader_layout` depends on it by version,
      # and packaging a crate resolves its dependencies against the registry
      # before anything is built. `cargo publish` waits for each crate to appear
      # in the index before it returns, which is what lets one step follow
      # another.
      #
      # There is no separate `--dry-run` pass. `cargo publish` builds the package
      # it is about to upload and stops before uploading if that fails, so the
      # upload already carries the check a dry run would make — and a dry run of
      # any crate after the first could not make it, since it would fail on the
      # dependency published a moment ago rather than on the package.
      - name: Publish `const_shader_layout_derive`
        run: cargo publish -p const_shader_layout_derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish `const_shader_layout`
        run: cargo publish -p const_shader_layout
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
